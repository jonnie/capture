[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capture"
version = "0.1.0"
description = "Capture anything the moment it occurs to you — a local-first web capture app with LLM auto-tagging and MCP integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "mcp>=2.0",
]

[project.scripts]
capture = "capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
