<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b9dd9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2 4 14h6l-1 8 9-12h-6l1-8Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
      </svg>
      <span>Capture</span>
    </div>
    <div class="topbar-search">
      <input id="search" type="search" placeholder="Search captures…  ( / )" aria-label="Search captures" autocomplete="off" spellcheck="false">
    </div>
    <div class="topbar-actions">
      <div class="view-toggle" role="group" aria-label="View">
        <button id="view-board" class="active" title="Grouped by tag">Board</button>
        <button id="view-list" title="Chronological list">List</button>
        <button id="view-graph" title="How captures connect via shared tags">Graph</button>
      </div>
      <button id="new-capture" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New <kbd>N</kbd>
      </button>
    </div>
  </header>

  <main id="main">
    <div id="board" class="view board-view" aria-label="Captures grouped by tag"></div>
    <div id="list" class="view list-view hidden" aria-label="Capture list"></div>
    <div id="graph" class="view graph-view hidden" aria-label="Capture graph">
      <div class="graph-hud">
        <span id="graph-stats" class="graph-stats"></span>
        <span class="graph-hint">Drag nodes · scroll to zoom · click a capture to zoom in · double-click to edit · click a tag to focus</span>
      </div>
      <canvas id="graph-canvas"></canvas>
      <div id="graph-tooltip" class="graph-tooltip hidden"></div>
      <div id="graph-empty" class="empty graph-empty hidden"></div>
    </div>
  </main>

  <!-- capture overlay -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay-backdrop" data-close-overlay></div>
    <div class="overlay-panel">
      <h2 id="overlay-title">New capture</h2>
      <p id="overlay-subtitle" class="subtitle"></p>
      <textarea id="capture-input" placeholder="Type your capture… (Enter for a new line, Ctrl/⌘+Enter to save)" aria-label="Capture text"></textarea>
      <div class="tag-row">
        <span class="tag-label">Tags</span>
        <div id="tag-picker" class="tag-picker"></div>
        <span id="auto-tag-note" class="auto-note">or leave blank to auto-tag</span>
      </div>
      <div class="overlay-actions">
        <button id="overlay-cancel" class="btn">Cancel <kbd>Esc</kbd></button>
        <button id="overlay-save" class="btn-primary">Save <kbd id="save-kbd">Ctrl ⏎</kbd></button>
      </div>
    </div>
  </div>

  <!-- delete confirmation -->
  <div id="confirm" class="overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="overlay-backdrop" data-close-confirm></div>
    <div class="overlay-panel small">
      <h2 id="confirm-title">Delete capture?</h2>
      <p class="subtitle">This permanently removes the capture from the database. This cannot be undone.</p>
      <div class="overlay-actions">
        <button id="confirm-cancel" class="btn">Cancel</button>
        <button id="confirm-delete" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
